<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UtosApp - Admin Users</title>
    <link rel="stylesheet" href="/css/admin-users.css?v=25">
    <link rel="stylesheet" href="/css/admin-bottom-nav.css?v=3">
    <link rel="stylesheet" href="/css/admin-entry.css">
</head>
<body>
    <main class="users-shell">
        <section class="users-hero" aria-labelledby="usersTitle">
            <div class="users-hero-content">
                <span class="admin-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3 4 6v5c0 5.2 3.4 8.5 8 10 4.6-1.5 8-4.8 8-10V6z"></path><path d="M9 11.5 11 14l4-4.5"></path></svg></span>
                <div><h1 id="usersTitle">Users</h1><small>Manage users and system settings.</small></div>
            </div>
        </section>

        <section class="user-stats" aria-label="User overview">
            <article class="stat-blue"><span class="stat-icon"><svg viewBox="0 0 24 24"><path d="M16 20v-1.5a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4V20M9 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM22 20v-1.5a4 4 0 0 0-3-3.9M16 2.1a4 4 0 0 0 0 7.8"></path></svg></span><strong id="totalUserCount">0</strong><small>Total Users</small></article>
            <article class="stat-green"><span class="stat-icon"><svg viewBox="0 0 24 24"><path d="M4 5h16v12H4zM8 21h8M12 17v4"></path></svg></span><strong id="teacherCount">0</strong><small>Teachers</small></article>
            <article class="stat-violet"><span class="stat-icon"><svg viewBox="0 0 24 24"><path d="M16 20v-1.5a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4V20M9 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM22 20v-1.5a4 4 0 0 0-3-3.9M16 2.1a4 4 0 0 0 0 7.8"></path></svg></span><strong id="studentCount">0</strong><small>Students</small></article>
        </section>

        <section class="user-tools" aria-label="User filters">
            <label class="search-box"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m16 16 4 4"></path></svg><input id="userSearch" type="search" placeholder="Search users by name, email or role..." aria-label="Search users"></label>
            <label class="role-filter"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg><select id="roleFilter" aria-label="Filter by role"><option value="all">All Roles</option><option value="teacher">Teachers</option><option value="student">Students</option></select></label>
        </section>

        <section class="user-list-section" aria-labelledby="userListTitle">
            <div class="section-heading"><h2 id="userListTitle"><span class="heading-icon"><svg viewBox="0 0 24 24"><path d="M16 20v-1.5a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4V20M9 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM22 20v-1.5a4 4 0 0 0-3-3.9M16 2.1a4 4 0 0 0 0 7.8"></path></svg></span>Users</h2></div>
            <h3 class="new-users-heading">Newly registered users</h3>
            <div class="user-list" id="userList">
            </div>
            <p class="empty-state" id="emptyState" hidden></p>
        </section>
    </main>

    <nav class="bottom-nav" aria-label="Admin navigation">
        <a class="bottom-nav-item" href="/admin-dashboard"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5v8a2 2 0 0 0 2 2H5a2 2 0 0 1-2-2zM9 21v-7h6v7"></path></svg><span>Dashboard</span></a>
        <a class="bottom-nav-item" href="/admin-tasks"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 11 2 2 4-4M5 4h14a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"></path></svg><span>Tasks</span></a>
        <a class="bottom-nav-item active" href="/admin-users" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 20v-1.5a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4V20M9 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM22 20v-1.5a4 4 0 0 0-3-3.9M16 2.1a4 4 0 0 1 0 7.8"></path></svg><span>Users</span></a>
        <a class="bottom-nav-item transactions-nav-item" href="/admin-transactions"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h15M4 17h15M8 3 4 7l4 4M16 13l4 4-4 4"></path></svg><span>Transaction</span></a>
        <a class="bottom-nav-item" href="/admin-account.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg><span>Account</span></a>
    </nav>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="/js/firebase-config.js"></script>
    <script src="/js/admin-users.js?v=20261002-delete-confirm-copy-25"></script>
    <script src="/js/admin-count-up.js"></script>
</body>
</html>
