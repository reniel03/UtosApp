<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UtosApp - Teacher Sign Up</title>
    <link rel="stylesheet" href="/css/signup.css">
</head>
<body class="teacher-signup">
    <div class="signup-container">
        <div class="logo-section">
            <button class="back-btn" onclick="signupModule.goBack()" title="Back">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7 7-7-7 7-7"/></svg>
            </button>
            <h1>TEACHER SIGN UP</h1>
        </div>

        <form class="signup-form" id="teacherSignupForm" onsubmit="signupModule.handleSignup(event, 'teacher')">
            <div class="form-row">
                <div class="form-group">
                    <label for="first_name">First Name <span class="required-indicator" aria-hidden="true">*</span></label>
                    <div class="teacher-input-wrap">
                        <svg class="teacher-field-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
                        <input type="text" id="first_name" name="first_name" placeholder="John" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="middle_name">Middle Initial <span class="optional-indicator">(OPTIONAL)</span></label>
                    <div class="teacher-input-wrap">
                        <svg class="teacher-field-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
                        <input type="text" id="middle_name" name="middle_name" placeholder="D">
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="last_name">Last Name <span class="required-indicator" aria-hidden="true">*</span></label>
                <div class="teacher-input-wrap">
                    <svg class="teacher-field-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
                    <input type="text" id="last_name" name="last_name" placeholder="David" required>
                </div>
            </div>

            <div class="form-group">
                <label for="gender">Gender <span class="required-indicator" aria-hidden="true">*</span></label>
                <div class="custom-dropdown" onclick="toggleGenderDropdown(event)">
                    <div class="dropdown-header">
                        <span id="genderSelected">Select your gender</span>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </div>
                    <div class="dropdown-menu" id="genderDropdownMenu">
                        <div class="dropdown-item" onclick="selectGender('Male', event)">Male</div>
                        <div class="dropdown-item" onclick="selectGender('Female', event)">Female</div>
                    </div>
                </div>
                <input type="hidden" id="gender" name="gender" required>
            </div>

            <div class="form-group">
                <label for="email">Email <span class="required-indicator" aria-hidden="true">*</span></label>
                <div class="input-wrapper teacher-input-wrap">
                    <svg class="teacher-field-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
                    <input type="email" id="email" name="email" placeholder="john.doe@example.com" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password <span class="required-indicator" aria-hidden="true">*</span></label>
                <div class="input-wrapper teacher-input-wrap teacher-password-wrap">
                    <svg class="teacher-field-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
                    <input type="password" id="password" name="password" placeholder="••••••••" required oninput="signupModule.checkPasswordStrength(this.value)">
                    <button type="button" class="password-toggle" onclick="signupModule.togglePassword('password')" id="eyeIcon">
                        <svg id="openEye" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg id="closedEye" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
                <div class="password-strength-container">
                    <div class="password-strength-bar-bg">
                        <div class="password-strength-bar" id="passwordStrengthBar"></div>
                    </div>
                    <span class="password-strength-text" id="passwordStrengthText"></span>
                </div>
                <div class="password-requirements">
                    <div class="requirements-title">Password must contain:</div>
                    <ul class="requirements-list">
                        <li id="req-length"><span class="requirement-icon">✓</span> At least 8 characters</li>
                        <li id="req-lowercase"><span class="requirement-icon">✓</span> Lowercase letter (a-z)</li>
                        <li id="req-uppercase"><span class="requirement-icon">✓</span> Uppercase letter (A-Z)</li>
                        <li id="req-number"><span class="requirement-icon">✓</span> Number (0-9)</li>
                        <li id="req-special"><span class="requirement-icon">✓</span> Special character (@_#*)</li>
                    </ul>
                </div>
            </div>

            <button type="submit" class="signup-btn" id="signupBtn">SIGN UP</button>
        </form>
    </div>

    <!-- Error Alert -->
    <div class="alert-overlay" id="errorAlert">
        <div class="alert-box" role="alertdialog" aria-modal="true" aria-labelledby="errorMessage">
            <div class="alert-icon" aria-hidden="true">!</div>
            <h2 id="errorMessage">An error occurred. Please try again.</h2>
            <button class="alert-btn" type="button" onclick="signupModule.closeAlert('errorAlert')">OK</button>
        </div>
    </div>

    <!-- Success Alert -->
    <div class="alert-overlay" id="successAlert">
        <div class="alert-box" role="status" aria-live="polite">
            <div class="alert-icon" aria-hidden="true">✓</div>
            <h2>Sign up successful! Redirecting...</h2>
        </div>
    </div>

    <!-- Firebase SDK (CDN - Compat mode for global firebase object) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    
    <!-- Firebase Configuration -->
    <script src="/js/firebase-config.js"></script>
    
    <!-- Signup Module -->
    <script src="/js/signup.js?v=20260906-teacher-back-persistence-3"></script>
</body>
</html>
