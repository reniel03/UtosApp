<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f3f9ff">
    <title>UtosApp | Messages</title>
    <link rel="stylesheet" href="/css/student-messages.css">
    <link rel="stylesheet" href="/css/student-bottom-nav.css">
</head>
<body class="student-messages-page">
    <main class="messages-page">
        <header class="messages-heading">
            <div class="messages-title-row">
            <div class="heading-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M20 11.5a8 8 0 0 1-8 8H7l-4 2.5V11.5a8 8 0 0 1 8-8h1a8 8 0 0 1 8 8Z"></path><path d="M7 11.5h.01M12 11.5h.01M17 11.5h.01"></path></svg>
            </div>
            <div>
                <h1>Messages</h1>
                <p>Stay connected with your teachers.</p>
            </div>
            </div>
            <img class="messages-illustration" src="/image/messages.png" alt="">
        </header>

        <section class="message-card" aria-labelledby="conversationHeading">
            <h2 id="conversationHeading" class="visually-hidden">Conversations</h2>
            <div class="message-toolbar">
                <label class="search-field">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4.5 4.5"></path></svg>
                    <input id="messageSearch" type="search" placeholder="Search messages" aria-label="Search messages">
                </label>
                <button class="filter-button" id="filterButton" type="button" aria-label="Show unread messages" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m4 7 8 6 8-6"></path></svg><span>Unread</span><i aria-hidden="true"></i></button>
            </div>
            <div id="messageList" class="message-list" aria-busy="true"></div>
            <div id="emptyState" class="empty-state" hidden>
                <img src="/image/chat.png" alt="" class="empty-state-image">
                <h3 id="emptyStateTitle">It looks pretty empty here...</h3>
                <p id="emptyStateMessage">Why not help some citizens in need?</p>
                <a id="emptyStateAction" href="/student-home">Get Started</a>
            </div>
        </section>
    </main>

    <nav class="bottom-nav" aria-label="Student navigation">
        <a class="bottom-nav-item" href="/student-home"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg><span>Browse</span></a>
        <a class="bottom-nav-item" href="/student-tasks"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 11 2 2 4-4M5 4h14a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/></svg><span>Tasks</span></a>
        <a class="bottom-nav-item" href="/student-history"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>History</span></a>
        <a class="bottom-nav-item active" href="/student-messages" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4H4a2 2 0 0 0-2 2v13l4-3h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Z"/></svg><span>Messages</span></a>
        <button class="bottom-nav-item" id="accountButton" type="button" aria-label="Account"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Account</span></button>
    </nav>

    <div class="chat-backdrop" id="chatModal" aria-hidden="true">
        <section class="chat-panel" role="dialog" aria-modal="true" aria-labelledby="chatName">
            <header class="chat-header"><button id="closeChat" class="back-button" type="button" aria-label="Close conversation"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6M9 12h12"></path></svg></button><div class="chat-person"><span id="chatAvatar" class="avatar">S</span><div><strong id="chatName">Teacher</strong><small id="chatRole">Teacher</small></div></div></header>
            <div id="chatMessages" class="chat-messages"></div>
            <form id="chatForm" class="chat-composer"><input id="chatInput" type="text" autocomplete="off" placeholder="Write a message..." aria-label="Message"><button type="submit" aria-label="Send message"><svg viewBox="0 0 24 24"><path d="m3 11 18-8-8 18-2-7z"></path><path d="m11 14 10-11"></path></svg></button></form>
        </section>
    </div>
    <div id="toast" class="toast" role="status"></div>
    <script src="/js/student-messages.js?v=15"></script>
</body>
</html>
