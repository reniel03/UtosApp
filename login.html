<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b3e91">
    <title>UtosApp - Login</title>
    <link rel="stylesheet" href="/css/login.css?v=login-remove-hero-tagline-v11">
</head>
<body>
    <main class="login-shell">
        <section class="hero" aria-labelledby="welcomeTitle">
            <div class="hero-glow hero-glow--one" aria-hidden="true"></div>
            <div class="hero-glow hero-glow--two" aria-hidden="true"></div>
            <div class="hero-orbit hero-orbit--one" aria-hidden="true"></div>
            <div class="hero-orbit hero-orbit--two" aria-hidden="true"></div>
            <span class="hero-particle hero-particle--one" aria-hidden="true"></span>
            <span class="hero-particle hero-particle--two" aria-hidden="true"></span>
            <span class="hero-particle hero-particle--three" aria-hidden="true"></span>

            <button class="back-btn" type="button" onclick="loginModule.goBack()" title="Back to Home" aria-label="Back to Home">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7 7-7-7 7-7"/></svg>
            </button>

            <div class="hero-copy">
                <h1 id="welcomeTitle">Utos<span>App</span></h1>
                <p class="hero-subtitle">Your all-in-one platform task assistant.</p>
            </div>

            <div class="hero-art">
                <div class="art-halo" aria-hidden="true"></div>
                <img class="login-illustration" src="/image/login.png" alt="A teacher and student celebrate a completed task together">
            </div>
        </section>

        <section class="login-panel" aria-labelledby="loginTitle">
            <div class="form-heading">
                <span class="form-kicker">WELCOME BACK!</span>
                <h2 id="loginTitle"><span class="login-title-desktop">Sign in to your account</span><span class="login-title-mobile">UtosApp</span></h2>
            </div>

            <form class="login-form" id="loginForm" novalidate onsubmit="loginModule.handleLogin(event)">
                <div class="form-group">
                    <label for="email">Email or username</label>
                    <div class="email-entry">
                        <div class="input-wrap">
                            <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
                            <input type="text" id="email" name="email" placeholder="Enter your email or username" autocomplete="username" aria-describedby="emailSuggestion">
                        </div>
                        <div class="email-suggestion" id="emailSuggestion" hidden>
                            <button class="email-suggestion-choice" id="emailSuggestionChoice" type="button"></button>
                            <button class="email-suggestion-dismiss" id="emailSuggestionDismiss" type="button" aria-label="Dismiss email suggestion">
                                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"></path></svg>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
                        <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                        <button type="button" class="password-toggle" onclick="loginModule.togglePassword()" id="eyeIcon" aria-label="Show or hide password">
                            <svg id="openEye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg id="closedEye" viewBox="0 0 24 24" aria-hidden="true" style="display:none"><path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a15.4 15.4 0 0 1-3 3.7M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10 10 0 0 0 3-.5"/></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">Log In</button>
            </form>

            <div class="divider" aria-hidden="true"><span></span><b>OR</b><span></span></div>
            <a href="/signup" class="signup-btn">Create an account</a>
            <p class="login-footnote">Students Earn Money. Teachers Save Time.</p>
        </section>

        <footer class="login-footer" aria-label="UtosApp activity highlights">
            <svg class="footer-waves" viewBox="0 0 520 120" preserveAspectRatio="none" aria-hidden="true">
                <path class="wave wave--back" d="M0 54C76 13 123 99 215 64s124-41 183-3 75 35 122-1v60H0z"/>
                <path class="wave wave--middle" d="M0 78c84-48 123 48 219 20s142-53 202-18 60 33 99 2v38H0z"/>
                <path class="wave wave--front" d="M0 92c78-29 137 19 205 17 80-2 125-36 196-31 50 3 81 28 119 16v26H0z"/>
            </svg>
            <div class="status-row">
                <div class="status-item">
                    <span class="status-icon status-icon--tasks" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg></span>
                    <span>Tasks</span>
                </div>
                <div class="status-item">
                    <span class="status-icon status-icon--progress" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 19v-5m7 5V9m7 10V5"/></svg></span>
                    <span>Progress</span>
                </div>
                <div class="status-item">
                    <span class="status-icon status-icon--completed" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m12 3 2.6 5.3 5.9.9-4.3 4.2 1 5.9-5.2-2.8-5.2 2.8 1-5.9-4.3-4.2 5.9-.9z"/></svg></span>
                    <span>Completed</span>
                </div>
            </div>
            <span class="footer-particle footer-particle--one" aria-hidden="true"></span>
            <span class="footer-particle footer-particle--two" aria-hidden="true"></span>
            <span class="footer-particle footer-particle--three" aria-hidden="true"></span>
        </footer>
    </main>

    <div class="alert-overlay" id="errorAlert">
        <div class="alert-box" role="alertdialog" aria-modal="true" aria-labelledby="errorMessage">
            <div class="alert-icon" aria-hidden="true">!</div>
            <h2 id="errorMessage">Invalid email or password. Please try again.</h2>
            <button class="alert-btn" type="button" onclick="loginModule.closeAlert('errorAlert')">OK</button>
        </div>
    </div>

    <div class="alert-overlay" id="successAlert">
        <div class="alert-box success-loading" role="status" aria-live="polite">
            <div class="loading-spinner" aria-hidden="true"></div>
            <h2>Login successful!</h2>
        </div>
    </div>

    <script src="/js/login.js"></script>
</body>
</html>
